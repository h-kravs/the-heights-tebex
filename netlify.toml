# ════════════════════════════════════════════════════════════════════
#  Netlify deploy config
#
#  Set VITE_TEBEX_TOKEN in Netlify → Site settings → Environment variables
#  BEFORE the first deploy. Vite inlines env vars at build time, so a build
#  without it ships the demo catalog, not the real store.
# ════════════════════════════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# ── Live stats proxy ──
# Must come before the SPA fallback: redirects are evaluated in order.
[[redirects]]
  from = "/api/server-stats"
  to = "/.netlify/functions/server-stats"
  status = 200

# ── SPA fallback ── React Router owns routing; deep links must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Vite fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand assets are not fingerprinted: cache for a day and revalidate.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# A stale app shell would point at hashed bundles that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
